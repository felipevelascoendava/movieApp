name: Movie App CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: movie-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and SonarQube
    runs-on: [self-hosted, linux, docker]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            mongo/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r mongo/requirements.txt

      - name: Run tests
        run: python -m pytest backend/test_app.py mongo/test_db.py --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  publish:
    name: Build and publish versioned images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image version
        id: version
        shell: bash
        run: echo "value=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-app-backend:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-app-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-app-frontend:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-app-frontend:latest

  deploy:
    name: Deploy on self-hosted runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, linux, docker]
    environment: production
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy version ${{ needs.publish.outputs.version }}
        env:
          APP_VERSION: ${{ needs.publish.outputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose pull backend frontend
          docker compose build proxy
          docker compose up -d --no-build --no-deps --wait --scale backend=2 backend
          docker compose up -d --no-build --no-deps --wait --scale frontend=2 frontend
          docker compose up -d --no-build --wait proxy db db-seed ollama ollama-model
          docker compose ps
